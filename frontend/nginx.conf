server {
  listen 80;
  server_name localhost;

  # Set the root directory for serving files
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # This is the key configuration for a Single Page Application (SPA).
    # It tries to find the requested file, then a directory, and if neither
    # exists, it falls back to serving /index.html. This allows client-side
    # routing to handle the URL.
    try_files $uri $uri/ /index.html;
  }

  # It's a good practice to handle API proxying here in production
  # to avoid CORS issues. This block can be uncommented and configured
  # if the frontend and backend are served under the same domain.
  # The name 'backend' would resolve to the backend service in a Docker Compose setup.
  #
  # location /api {
  #   proxy_pass http://backend:5000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
}
